    id: status_led_red
    pin: GPIO14
    inverted: true
  - platform: ledc
    id: status_led_green
    pin: GPIO26
    inverted: true
  - platform: ledc
    id: status_led_blue
    pin: GPIO27
    inverted: true

light:
  - platform: rgb
    name: "Status LED"
    red: status_led_red
    green: status_led_green
    blue: status_led_blue

button:
