# SPIKE-01 (D-08/D-09/D-10, phase 10-01): includes: pulls in the temporary
# SpikeHandler route handler; on_boot: priority -100 registers it on base_ws
# after web_server setup completes (Pitfall 3) so add_handler() doesn't race
# web_server_base's own init(). Both entries are removed after the soak
# regardless of go/no-go verdict.
esphome:
  name: fp2-sala
  includes:
    - spike_handler.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(base_ws)->add_handler(new SpikeHandler());

esp32:
  board: esp32-solo1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: "y"
      CONFIG_ESP_SYSTEM_SINGLE_CORE_MODE: "y"
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true
      sram1_as_iram: true

# RUN-02/RUN-04 (09-03): a saved zone/Global-Zone override is a rare,
# deliberate user action, not a high-frequency write - commit it to flash
# promptly (flash_write_interval: 0s) so it survives a quick hard
# power-cycle right after saving, not just a graceful reboot. The extra
# flash wear is negligible given how infrequently saves happen.
preferences:
  flash_write_interval: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "FP2 Fallback"
    password: !secret ap_password

captive_portal:

# SPIKE-01/D-09 (phase 10-01): explicit web_server_base: id so the temporary
# SpikeHandler /spike route (D-08) can be registered via add_handler() from
# esphome: on_boot: above. Temporary, removed after the soak (D-10).
web_server_base:
  id: base_ws

# Local diagnostics page on the device IP (http://<device-ip>/).
# version 2 is embedded/offline-friendly and light on the SOLO-1.
# Add an `auth:` block if you want to password-protect it.
web_server:
  web_server_base_id: base_ws
  port: 80
  version: 2

api:
  encryption:
    key: !secret api_encryption_key

  actions:
    - action: get_map_config
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              id(fp2).json_get_map_data(root);
    - action: fp2_force_detection_config
      then:
        - lambda: |-
            id(fp2).force_detection_config();
    - action: fp2_configure_sleep_mode
      variables:
        width: int
        length: int
        mount_position: int
      then:
        - lambda: |-
            id(fp2).configure_sleep_mode((uint16_t) width, (uint16_t) length, (uint8_t) mount_position);
    - action: fp2_set_work_mode
      variables:
        mode: int
      then:
        - lambda: |-
            id(fp2).set_work_mode((uint8_t) mode);
    - action: fp2_calibrate_empty_room
      then:
        - lambda: |-
            id(fp2).calibrate_empty_room();
    - action: fp2_reset_radar
      then:
        - lambda: |-
            id(fp2).reset_radar();
    - action: fp2_read_attr
      variables:
        attr: int
      then:
        - lambda: |-
            id(fp2).read_attr((uint16_t) attr);
    - action: fp2_write_attr_uint8
      variables:
        attr: int
        value: int
      then:
        - lambda: |-
            id(fp2).write_attr_uint8((uint16_t) attr, (uint8_t) value);
    # RUN-04 (09-01): live Global Zone presence_sensitivity save with a real
    # ACK-feedback response - wait_until: suspends until save_pending()
    # empties (ACK) or save_failed_ is set (retry-exhaust/invalid input),
    # then api.respond reports the true outcome (RESEARCH Pattern 3).
    - action: fp2_save_global_zone_to_sensor
      variables:
        sensitivity: int
      supports_response: status
      then:
        - lambda: |-
            id(fp2).save_global_zone_to_sensor((uint8_t) sensitivity);
        - wait_until:
            timeout: 3s
            condition:
              lambda: 'return !id(fp2).save_pending();'
        - api.respond:
            success: !lambda 'return id(fp2).save_ok();'
            error_message: !lambda 'return id(fp2).save_error();'
    # RUN-01 (09-02): live single-zone save (grid + sensitivity + zone_type)
    # bundled into one write the radar ACKs (D-02), using the same
    # wait_until:+api.respond ACK-feedback mechanism as
    # fp2_save_global_zone_to_sensor above. zone_type: -1 means "not set".
    # 8s timeout covers worst-case FIFO retry-exhaustion across up to 4
    # sequential registers (RESEARCH Pitfall 5), not just one.
    - action: fp2_save_zone_to_sensor
      variables:
        zone_id: int
        grid_hex: string
        sensitivity: int
        zone_type: int
      supports_response: status
      then:
        - lambda: |-
            id(fp2).save_zone_to_sensor((uint8_t) zone_id, grid_hex, (uint8_t) sensitivity, zone_type);
        - wait_until:
            timeout: 8s
            condition:
              lambda: 'return !id(fp2).save_pending();'
        - api.respond:
            success: !lambda 'return id(fp2).save_ok();'
            error_message: !lambda 'return id(fp2).save_error();'

